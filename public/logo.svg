<svg width="600" height="200" viewBox="0 0 600 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metallic Gold Gradients -->
    <linearGradient id="logoGoldShield" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FCEBA4"/>
      <stop offset="25%" stop-color="#DFB354"/>
      <stop offset="50%" stop-color="#C59328"/>
      <stop offset="75%" stop-color="#F5DB7B"/>
      <stop offset="100%" stop-color="#9E6F10"/>
    </linearGradient>

    <linearGradient id="logoGoldZ" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="30%" stop-color="#E2B859"/>
      <stop offset="70%" stop-color="#BC8924"/>
      <stop offset="100%" stop-color="#F2D572"/>
    </linearGradient>

    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Left: Golden Shield with Geometric Z -->
  <g transform="translate(15, 12) scale(0.36)" filter="url(#logoShadow)">
    <!-- Outer Shield Border -->
    <path d="M256 36 L430 96 C430 290 358 410 256 480 C154 410 82 290 82 96 Z" 
          fill="none" 
          stroke="url(#logoGoldShield)" 
          stroke-width="22" 
          stroke-linejoin="round"/>

    <!-- Inner Shield Cavity (Dark) -->
    <path d="M256 56 L410 108 C410 278 344 392 256 454 C168 392 102 278 102 108 Z" 
          fill="#0c0d11" 
          stroke="url(#logoGoldShield)" 
          stroke-width="4"/>

    <!-- Prominent Golden Geometric "Z" -->
    <path d="M164 140 L348 140 L348 196 L232 316 L348 316 L348 372 L164 372 L164 316 L280 196 L164 196 Z" 
          fill="url(#logoGoldZ)"
          stroke="#4D3305"
          stroke-width="3"
          stroke-linejoin="miter"/>
  </g>

  <!-- Right: Typography -->
  <!-- "Z" in Gold -->
  <text x="210" y="88" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="64" font-weight="900" fill="url(#logoGoldZ)">Z</text>
  
  <!-- "FORÇA E" in White -->
  <text x="260" y="88" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="3">FORÇA E</text>
  
  <!-- "PROTECÇÃO" in Bold White -->
  <text x="210" y="146" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" letter-spacing="4">PROTECÇÃO</text>
  
  <!-- "SEGURANÇA EM PRIMEIRO LUGAR" in Gold with spacing -->
  <text x="212" y="180" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#DFB354" letter-spacing="6">SEGURANÇA EM PRIMEIRO LUGAR</text>
</svg>
