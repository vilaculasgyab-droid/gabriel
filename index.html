    <script>
      // Filter benign Vite websocket disconnection warnings in AI Studio preview iframe
      (function() {
        const origError = console.error;
        console.error = function(...args) {
          if (args[0] === '[vite]' || (typeof args[0] === 'string' && (args[0].includes('[vite]') || args[0].includes('WebSocket closed')))) {
            console.debug(...args);
            return;
          }
          origError.apply(console, args);
        };
      })();
      // Safeguard for Vite React Fast Refresh preamble detection
      if (typeof window !== 'undefined' && !window.__vite_plugin_react_preamble_installed__) {
        window.__vite_plugin_react_preamble_installed__ = true;
      }
